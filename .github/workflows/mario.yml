name: Generate Mario Contribution World

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mario.yml"
      - "scripts/generate_mario.py"
      - "scripts/activate_mario.py"

permissions:
  contents: write

concurrency:
  group: contribution-mario
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Generate Mario from real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_mario.py

      - name: Validate SVG and activate Mario in README
        run: python3 scripts/activate_mario.py

      - name: Commit animation and README together
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-mario.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Mario contribution world"
          git push origin HEAD:main
