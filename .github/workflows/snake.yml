name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Validate SVGs and activate snake section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          for name in ("github-snake.svg", "github-snake-dark.svg"):
              path = Path("assets") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing SVG: {path}")
              if ET.parse(path).getroot().tag.rsplit("}", 1)[-1] != "svg":
                  raise SystemExit(f"Invalid SVG: {path}")
          
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "<!-- CONTRIBUTION_SNAKE: activate only after SVG assets exist -->"
          section = "<!-- ========== SNAKE ANIMATION ========== -->\n## 🐍 Contribution Snake\n\n<div align=\"center\">\n  <picture>\n    <source media=\"(prefers-color-scheme: dark)\" srcset=\"https://raw.githubusercontent.com/Ductri2006/Ductri2006/main/assets/github-snake-dark.svg\" />\n    <source media=\"(prefers-color-scheme: light)\" srcset=\"https://raw.githubusercontent.com/Ductri2006/Ductri2006/main/assets/github-snake.svg\" />\n    <img alt=\"Snake animation of Ductri2006's GitHub contributions\" src=\"https://raw.githubusercontent.com/Ductri2006/Ductri2006/main/assets/github-snake.svg\" />\n  </picture>\n</div>\n\n---\n\n"
          if marker in readme:
              updated = readme.replace(marker, section.rstrip(), 1)
          elif "<!-- ========== SNAKE ANIMATION ========== -->" in readme:
              updated = re.sub(
                  r"<!-- ========== SNAKE ANIMATION ========== -->[\s\S]*?(?=<!-- ========== RANDOM QUOTE ========== -->)",
                  lambda _: section,
                  readme,
                  count=1,
              )
          else:
              updated = readme
          if updated != readme:
              readme_path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit SVGs and README together
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution snake assets"
          git push origin HEAD:main
